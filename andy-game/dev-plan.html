<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andy 100层房子 - 开发计划看板</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0f1e;
    --bg-card: #161b33;
    --bg-card-hover: #1e2340;
    --sky-top: #16213e;
    --sky-bottom: #0f3460;
    --gold: #ffd93d;
    --gold-dim: #ffb347;
    --coral: #ff6b6b;
    --mint: #6bcb77;
    --sky: #4d96ff;
    --lavender: #9b72cf;
    --text: #ffffff;
    --text-muted: #a0a0c0;
    --text-dim: #5a5a7a;
    --border: rgba(255,255,255,0.08);
    --radius: 12px;
    --radius-sm: 8px;
  }

  html { font-size: 16px; }

  body {
    font-family: 'Nunito', -apple-system, 'Segoe UI', sans-serif;
    background: linear-gradient(170deg, var(--bg) 0%, var(--sky-top) 40%, var(--sky-bottom) 100%);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Starfield */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 15% 85%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 55% 75%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 85% 15%, rgba(255,255,255,0.5), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .header h1 {
    font-size: 1.75rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header .subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .reset-btn {
    font-size: 0.75rem;
    color: var(--text-dim);
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .reset-btn:hover { color: var(--coral); border-color: rgba(255,107,107,0.3); background: rgba(255,107,107,0.08); }

  /* Total progress */
  .total-progress {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }

  .total-progress::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--gold), var(--mint));
    box-shadow: 0 0 16px rgba(255,217,61,0.4);
  }

  .total-progress .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .total-progress .label { font-weight: 700; font-size: 0.9rem; }

  .total-progress .stats {
    display: flex;
    gap: 16px;
    font-size: 0.8rem;
  }

  .total-progress .stat { display: flex; align-items: center; gap: 4px; }
  .total-progress .stat .dot { width: 8px; height: 8px; border-radius: 50%; }

  .progress-track {
    height: 8px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--gold), var(--mint));
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 12px rgba(255,217,61,0.3);
  }

  /* Phase */
  .phase {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
    transition: box-shadow 0.3s;
  }

  .phase:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.3); }

  .phase-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }

  .phase-header:hover { background: rgba(255,255,255,0.03); }

  .phase-chevron {
    font-size: 0.7rem;
    color: var(--text-muted);
    transition: transform 0.3s;
    width: 16px;
    text-align: center;
  }

  .phase.collapsed .phase-chevron { transform: rotate(-90deg); }

  .phase-icon { font-size: 1.2rem; }

  .phase-title {
    font-weight: 800;
    font-size: 0.95rem;
    flex: 1;
  }

  .phase-time {
    font-size: 0.7rem;
    color: var(--text-dim);
    background: rgba(255,255,255,0.05);
    padding: 2px 10px;
    border-radius: 10px;
  }

  .phase-count {
    font-size: 0.75rem;
    font-weight: 700;
    min-width: 28px;
    text-align: center;
  }

  .phase-progress-bar {
    width: 80px;
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }

  .phase-progress-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.4s;
  }

  .phase-body {
    border-top: 1px solid var(--border);
    padding: 8px 12px 12px;
    display: grid;
    gap: 8px;
  }

  .phase.collapsed .phase-body { display: none; }

  /* Task */
  .task {
    display: flex;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.02);
    border: 1px solid transparent;
    transition: all 0.15s;
    align-items: flex-start;
  }

  .task:hover {
    background: rgba(255,255,255,0.04);
    border-color: var(--border);
  }

  /* Status button */
  .status-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
  }

  .status-btn:hover { transform: scale(1.15); }

  .status-btn[data-status="pending"] {
    border-color: var(--text-dim);
    color: var(--text-dim);
  }
  .status-btn[data-status="confirmed"] {
    border-color: var(--sky);
    color: var(--sky);
    background: rgba(77,150,255,0.12);
  }
  .status-btn[data-status="in_progress"] {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(255,217,61,0.12);
    animation: pulse-ring 2s infinite;
  }
  .status-btn[data-status="done"] {
    border-color: var(--mint);
    color: var(--mint);
    background: rgba(107,203,119,0.12);
  }

  @keyframes pulse-ring {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,217,61,0.3); }
    50% { box-shadow: 0 0 0 4px rgba(255,217,61,0); }
  }

  .task-body { flex: 1; min-width: 0; }

  .task-id {
    font-size: 0.65rem;
    font-weight: 800;
    color: var(--sky);
    background: rgba(77,150,255,0.1);
    padding: 1px 7px;
    border-radius: 4px;
    display: inline-block;
    margin-bottom: 4px;
  }

  .task-title {
    font-size: 0.88rem;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .task[data-status="done"] .task-title {
    text-decoration: line-through;
    opacity: 0.5;
  }

  .task-desc {
    font-size: 0.75rem;
    color: var(--text-muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 6px;
  }

  .task-meta {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .task-file {
    font-size: 0.65rem;
    color: var(--text-dim);
    background: rgba(255,255,255,0.04);
    padding: 2px 8px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .complexity {
    font-size: 0.6rem;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }

  .complexity-S { background: rgba(107,203,119,0.15); color: var(--mint); }
  .complexity-M { background: rgba(255,217,61,0.15); color: var(--gold); }
  .complexity-L { background: rgba(255,107,107,0.15); color: var(--coral); }

  /* Copy prompt */
  .copy-btn {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--lavender);
    background: rgba(155,114,207,0.12);
    border: 1px solid rgba(155,114,207,0.2);
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .copy-btn:hover { background: rgba(155,114,207,0.25); border-color: var(--lavender); }
  .copy-btn.copied { color: var(--mint); background: rgba(107,203,119,0.15); border-color: rgba(107,203,119,0.3); }

  /* Status label */
  .status-label {
    font-size: 0.6rem;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
  }
  .status-label[data-status="pending"] { background: rgba(90,90,122,0.2); color: var(--text-dim); }
  .status-label[data-status="confirmed"] { background: rgba(77,150,255,0.12); color: var(--sky); }
  .status-label[data-status="in_progress"] { background: rgba(255,217,61,0.12); color: var(--gold); }
  .status-label[data-status="done"] { background: rgba(107,203,119,0.12); color: var(--mint); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 24px;
    border-radius: 24px;
    font-size: 0.8rem;
    font-weight: 700;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
    opacity: 0;
    z-index: 100;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* Responsive */
  @media (max-width: 600px) {
    .app { padding: 16px 10px 48px; }
    .header h1 { font-size: 1.3rem; }
    .task { padding: 10px 10px; gap: 8px; }
    .phase-progress-bar { width: 50px; }
    .task-file { max-width: 140px; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const PHASES = [
  {
    id: 'phase1',
    title: 'Phase 1: 关键Bug修复',
    icon: '🐛',
    time: '1-2天',
    color: '#ff6b6b',
    tasks: [
      { id: '1.1', title: 'f009缺少getFloorMeta导入 — 运行时崩溃', desc: 'getFloorMeta(9)被调用但从未从_registry导入，赢牌时触发ReferenceError。修复：添加import', file: 'src/floors/f009-simple-cards/index.tsx', complexity: 'S', prompt: '修复 f009 运行时崩溃：在 src/floors/f009-simple-cards/index.tsx 第4行添加 `import { getFloorMeta } from "../_registry";`。当前第190行调用 getFloorMeta(9) 但未导入，赢牌时触发 ReferenceError。' },
      { id: '1.2', title: 'getFloorComponent每次渲染创建新lazy() — 游戏状态丢失', desc: 'getFloorComponent()每次调用都执行lazy(loader)，FloorPage每次re-render创建新组件类型，React卸载/重载整个游戏，丢失所有进度', file: 'src/floors/_registry.ts, src/pages/FloorPage/index.tsx', complexity: 'S', prompt: '修复 getFloorComponent 游戏状态丢失：在 src/floors/_registry.ts 中，当前 getFloorComponent 每次调用都执行 lazy()，导致 FloorPage re-render 时创建新组件类型，React 卸载重载整个游戏丢失进度。修复方案：添加模块级缓存 `const lazyCache: Record<number, React.LazyExoticComponent<FloorProps>> = {};`，getFloorComponent 中先查缓存再创建。' },
      { id: '1.3', title: 'elevatorUsesRemaining被持久化 — 违背设计意图', desc: 'elevatorUsesRemaining在partialize中被持久化到localStorage。设计意图是每次新会话重置3次，但持久化导致隔天回来电梯次数仍为0', file: 'src/store/useGameStore.ts', complexity: 'S', prompt: '修复 elevatorUsesRemaining 持久化问题：在 src/store/useGameStore.ts 的 partialize 返回对象中移除 elevatorUsesRemaining，让它使用默认值3，这样每次新会话重置为3次。' },
      { id: '1.4', title: 'PWA图标文件缺失 — 安装失败', desc: 'manifest.json引用的图标文件icon-192.png和icon-512.png不存在，PWA无法安装', file: 'public/icon-192.png, public/icon-512.png', complexity: 'S', prompt: '修复 PWA 图标缺失：基于 public/favicon.svg（或任何现有图标）生成 public/icon-192.png 和 public/icon-512.png，确保 manifest.json 引用的图标文件存在。可以用 canvas 或在线工具生成。' },
      { id: '1.5', title: 'playSound不检查audioEnabled — 音效无视用户设置', desc: 'playSound()从未检查useGameStore.getState().audioEnabled，音效永远播放', file: 'src/utils/audio.ts', complexity: 'S', prompt: '修复 playSound 无视用户设置：在 src/utils/audio.ts 的 playSound 函数开头添加 `if (!useGameStore.getState().audioEnabled) return;`，确保音效开关生效。' },
      { id: '1.6', title: 'addStars在completeFloor外调用 — 双重渲染', desc: 'completeFloor先set({...})再get().addStars(stars)，产生两次状态更新和两次渲染', file: 'src/store/useGameStore.ts', complexity: 'S', prompt: '修复 completeFloor 双重渲染：在 src/store/useGameStore.ts 的 completeFloor 中，将 totalStars 更新合并到同一个 set() 调用中：添加 `totalStars: get().totalStars + stars`，然后删除 `get().addStars(stars)` 那行。' },
      { id: '1.7', title: '添加ErrorBoundary — 任何游戏崩溃导致白屏', desc: '全局无ErrorBoundary，任何楼层游戏报错会导致整个应用崩溃白屏。创建友好ErrorBoundary组件', file: '新建src/components/ErrorBoundary.tsx; 修改src/app/App.tsx', complexity: 'M', prompt: '添加全局 ErrorBoundary：1) 新建 src/components/ErrorBoundary.tsx，创建 class 组件捕获错误，渲染友好的"出了点问题"+ "返回大厅"按钮；2) 在 src/app/App.tsx 中用 ErrorBoundary 包裹 Routes，在 FloorPage 中用 ErrorBoundary 包裹 Suspense。' },
    ]
  },
  {
    id: 'phase2',
    title: 'Phase 2: 架构改进',
    icon: '🏗️',
    time: '3-5天',
    color: '#4d96ff',
    tasks: [
      { id: '2.1', title: '提取BoardGameShell共享组件', desc: '4个棋盘游戏重复相同的UI框架：状态栏、帮助/认输/认赢按钮、输赢覆盖层、Framer Motion弹簧动画。handleConcede/handleClaimWin在7个文件中复制粘贴', file: '新建src/floors/_shared/BoardGameShell.tsx; 修改f001/f004/f007/f009', complexity: 'L', prompt: '提取 BoardGameShell 共享组件：1) 新建 src/floors/_shared/BoardGameShell.tsx + .module.css，接收 gameInfo/board/actionButtons/helperChar/winner 等 props，统一渲染游戏外壳（状态栏、按钮、输赢覆盖层、弹簧动画）；2) 重构 f001/f004/f007/f009 使用 BoardGameShell，消除 handleConcede/handleClaimWin 的重复代码。' },
      { id: '2.2', title: '清理setTimeout定时器', desc: '用户中途退出楼层时，setTimeout回调在已卸载组件上设置state，造成内存泄漏。涉及f001/f002/f004/f007/f009', file: '所有楼层组件的helpHint/AI move setTimeout', complexity: 'M', prompt: '清理 setTimeout 定时器泄漏：创建 src/hooks/useTimeout.ts hook，自动在 unmount 时清理 timer。然后在所有楼层组件中替换 setTimeout 调用：f001（helpHint + AI move）、f002（helpHint）、f004（helpHint + AI move）、f007（helpHint + AI move）、f009（helpHint + AI turn）中的 setTimeout 都改用 useTimeout。' },
      { id: '2.3', title: '添加404路由和导航守卫', desc: '无catch-all路由，访问未定义URL显示空白；/elevator等页面无playerName守卫', file: 'src/app/App.tsx', complexity: 'S', prompt: '添加404路由和导航守卫：在 src/app/App.tsx 中：1) 添加 `<Route path="*" element={<Navigate to="/" replace />} />` 作为 catch-all；2) 为 /elevator、/floor/:floorId 等路由添加 playerName 守卫，无 playerName 时重定向到首页。' },
      { id: '2.4', title: '修复依赖问题', desc: 'howler和@types/howler已安装但从未使用（约30KB死代码）；vite和@vitejs/plugin-react同时在dependencies和devDependencies中', file: 'package.json', complexity: 'S', prompt: '修复 package.json 依赖问题：1) 移除未使用的 howler 和 @types/howler 依赖；2) 将 vite 和 @vitejs/plugin-react 从 dependencies 移到仅 devDependencies（当前同时出现在两处）。然后运行 npm install 更新 lock 文件。' },
      { id: '2.5', title: '修复CSS冲突', desc: '全局button:active { transform: scale(0.95) }与Framer Motion的whileTap冲突，导致按钮闪烁', file: 'src/styles/global.css', complexity: 'S', prompt: '修复 CSS 冲突：在 src/styles/global.css 中移除全局 `button:active { transform: scale(0.95) }` 规则（约第62-64行），因为它与 Framer Motion 的 whileTap 动画冲突导致按钮闪烁。需要按钮点击效果的地方统一使用 FM 的 whileTap。' },
      { id: '2.6', title: '修复WelcomePage星星位置', desc: 'Math.random()在渲染函数中直接调用，每次re-render星星位置变化，星星跳动', file: 'src/pages/WelcomePage/index.tsx', complexity: 'S', prompt: '修复 WelcomePage 星星跳动：在 src/pages/WelcomePage/index.tsx 中，Math.random() 在渲染函数中直接调用（约30-41行），每次 re-render 星星位置变化。将星星位置提取为模块级常量数组或用 `useMemo(() => ..., [])` 缓存。' },
      { id: '2.7', title: '修复biased洗牌算法', desc: 'sort(() => Math.random() - 0.5)产生不均匀分布。cardAI.ts已有正确的Fisher-Yates实现', file: 'EduGame.tsx, f003/f005/f006/f008', complexity: 'S', prompt: '修复 biased 洗牌算法：1) 提取 Fisher-Yates 到 src/utils/shuffle.ts（参考 cardAI.ts:38-44 的正确实现）；2) 替换 EduGame.tsx:226-229 和 f003/f005/f006/f008 中所有 `sort(() => Math.random() - 0.5)` 为新的 shuffle 函数调用。' },

const STATUS_ORDER = ['pending', 'confirmed', 'in_progress', 'done'];
const STATUS_ICON = { pending: '○', confirmed: '◎', in_progress: '◑', done: '●' };
const STATUS_LABEL = { pending: '待开发', confirmed: '已确认', in_progress: '开发中', done: '已完成' };

const STORAGE_KEY = 'andy-dev-plan-status';

function loadStatus() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch { return {}; }
}

function saveStatus(status) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(status));
}

let taskStatus = loadStatus();

function getStatus(taskId) {
  return taskStatus[taskId] || 'pending';
}

function cycleStatus(taskId) {
  const current = getStatus(taskId);
  const idx = STATUS_ORDER.indexOf(current);
  const next = STATUS_ORDER[(idx + 1) % STATUS_ORDER.length];
  taskStatus[taskId] = next;
  saveStatus(taskStatus);
  render();
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 1800);
}

function copyPrompt(taskId, btn) {
  const task = PHASES.flatMap(p => p.tasks).find(t => t.id === taskId);
  if (!task) return;
  navigator.clipboard.writeText(task.prompt).then(() => {
    btn.classList.add('copied');
    btn.textContent = '已复制 ✓';
    showToast('📋 Prompt 已复制到剪贴板');
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = '复制Prompt';
    }, 1500);
  }).catch(() => {
    showToast('复制失败，请手动复制');
  });
}

function togglePhase(phaseId) {
  const el = document.querySelector(`[data-phase="${phaseId}"]`);
  el.classList.toggle('collapsed');
}

function resetAll() {
  if (!confirm('确定重置所有任务状态？此操作不可撤销。')) return;
  taskStatus = {};
  saveStatus(taskStatus);
  render();
  showToast('已重置所有状态');
}

function computeStats() {
  const all = PHASES.flatMap(p => p.tasks);
  const done = all.filter(t => getStatus(t.id) === 'done').length;
  const inProgress = all.filter(t => getStatus(t.id) === 'in_progress').length;
  const confirmed = all.filter(t => getStatus(t.id) === 'confirmed').length;
  const pending = all.length - done - inProgress - confirmed;
  return { total: all.length, done, inProgress, confirmed, pending };
}

function phaseStats(phase) {
  const done = phase.tasks.filter(t => getStatus(t.id) === 'done').length;
  return { total: phase.tasks.length, done };
}

function render() {
  const stats = computeStats();
  const pct = Math.round((stats.done / stats.total) * 100);

  let html = `
    <div class="header">
      <div>
        <h1>📋 开发计划看板</h1>
        <div class="subtitle">Andy的100层房子 — 共${stats.total}项任务，预估20-29天</div>
      </div>
      <button class="reset-btn" onclick="resetAll()">重置状态</button>
    </div>

    <div class="total-progress">
      <div class="row">
        <span class="label">总体进度 ${pct}%</span>
        <div class="stats">
          <span class="stat"><span class="dot" style="background:#5a5a7a"></span> 待开发 ${stats.pending}</span>
          <span class="stat"><span class="dot" style="background:#4d96ff"></span> 已确认 ${stats.confirmed}</span>
          <span class="stat"><span class="dot" style="background:#ffd93d"></span> 开发中 ${stats.inProgress}</span>
          <span class="stat"><span class="dot" style="background:#6bcb77"></span> 已完成 ${stats.done}</span>
        </div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
    </div>
  `;

  for (const phase of PHASES) {
    const ps = phaseStats(phase);
    const ppct = Math.round((ps.done / ps.total) * 100);
    const hasProgress = ps.done > 0;
    const fillColor = hasProgress ? phase.color : 'rgba(255,255,255,0.1)';

    html += `
      <div class="phase" data-phase="${phase.id}">
        <div class="phase-header" onclick="togglePhase('${phase.id}')">
          <span class="phase-chevron">▼</span>
          <span class="phase-icon">${phase.icon}</span>
          <span class="phase-title">${phase.title}</span>
          <span class="phase-time">${phase.time}</span>
          <span class="phase-count" style="color:${phase.color}">${ps.done}/${ps.total}</span>
          <div class="phase-progress-bar">
            <div class="phase-progress-fill" style="width:${ppct}%;background:${fillColor}"></div>
          </div>
        </div>
        <div class="phase-body">
    `;

    for (const task of phase.tasks) {
      const status = getStatus(task.id);
      html += `
        <div class="task" data-status="${status}">
          <button class="status-btn" data-status="${status}" onclick="cycleStatus('${task.id}')" title="点击切换状态">${STATUS_ICON[status]}</button>
          <div class="task-body">
            <span class="task-id">${task.id}</span>
            <div class="task-title">${task.title}</div>
            <div class="task-desc">${task.desc}</div>
            <div class="task-meta">
              ${task.file ? `<span class="task-file" title="${task.file}">${task.file}</span>` : ''}
              <span class="complexity complexity-${task.complexity}">${task.complexity}</span>
              <span class="status-label" data-status="${status}">${STATUS_LABEL[status]}</span>
              <button class="copy-btn" onclick="copyPrompt('${task.id}', this)">复制Prompt</button>
            </div>
          </div>
        </div>
      `;
    }

    html += `</div></div>`;
  }

  document.getElementById('app').innerHTML = html;
}

render();
</script>
</body>
</html>
